name: BatchD 1.1 acquisition V2 validation
on:
  push:
    branches: [engineering/batchd-11-acq-v2-validation]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static and environment gates
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='engineering/batchd11/ACQUIRE_1_1_SOURCE.ps1'
          $tok=$null;$err=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tok,[ref]$err)
          if(@($err).Count){$err|%{Write-Error $_.Message};throw 'WINDOWS_PS_PARSE_FAIL'}
          Write-Output 'WINDOWS_POWERSHELL_PARSE=PASS'
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $a=@(Invoke-ScriptAnalyzer -Path $p -Severity ParseError,Error)
          if($a.Count){$a|Format-Table|Out-String|Write-Error;throw 'PSSCRIPTANALYZER_FAIL'}
          Write-Output 'PSSCRIPTANALYZER_PARSEERROR=0'
          Write-Output 'PSSCRIPTANALYZER_ERROR=0'
          if(Get-Command pwsh -ErrorAction SilentlyContinue){
            pwsh -NoProfile -Command '$t=$null;$e=$null;[void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "engineering/batchd11/ACQUIRE_1_1_SOURCE.ps1"),[ref]$t,[ref]$e);if(@($e).Count){exit 1}'
            if($LASTEXITCODE){throw 'PWSH_PARSE_FAIL'}
            Write-Output 'PWSH_PARSE=PASS'
          }
      - name: Behaviour success fixture
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $r=Join-Path $env:RUNNER_TEMP 'fixture'
          $o=Join-Path $r 'TMNM\OwnerConsole\CanonicalBridgeReview_579a2cf7a4da5591\tmnm_owner_console'
          New-Item -ItemType Directory -Force (Join-Path $o 'static'),(Join-Path $r 'TMNM\LocalWorker\app')|Out-Null
          Set-Content (Join-Path $o 'app.py') "REVIEW_READY OWNER_APPROVED WRITE_DISABLED_MASTER_HOLD /api/workflow/approve schedule" -Encoding UTF8
          Set-Content (Join-Path $o 'owner_workflow.py') "OWNER_APPROVED schedule" -Encoding UTF8
          Set-Content (Join-Path $o 'static\app.js') "REVIEW_READY OWNER_APPROVED schedule" -Encoding UTF8
          Set-Content (Join-Path $o 'static\index.html') "ui" -Encoding UTF8
          Set-Content (Join-Path $r 'TMNM\LocalWorker\app\scheduler.py') "selected_publish_utc SCHEDULED NOT_QUEUED scheduler" -Encoding UTF8
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File engineering/batchd11/ACQUIRE_1_1_SOURCE.ps1 -TestRoot $r
          if($LASTEXITCODE){throw 'WINPS51_BEHAVIOUR_FAIL'}
          $m=Get-Content (Join-Path $r 'TMNM\LocalWorker\evidence\TMNM_1_1_EXACT_SOURCE_ACQUISITION\MANIFEST.json') -Raw|ConvertFrom-Json
          if(-not($m.tag -contains 'OWNER_APP')){throw 'OWNER_APP_MISSING'}
          if(-not($m.tag -contains 'OWNER_WORKFLOW')){throw 'OWNER_WORKFLOW_MISSING'}
          if(-not(@($m.tag|?{$_ -like 'UI_*'}).Count)){throw 'UI_MISSING'}
          if(-not(@($m.tag|?{$_ -like 'SCHED_*'}).Count)){throw 'SCHED_MISSING'}
          if(Test-Path (Join-Path $env:USERPROFILE 'Desktop\TMNM_1_1_EXACT_SOURCE_ACQUISITION_RESULT.zip')){throw 'DESKTOP_OUTPUT_FOUND'}
          Write-Output 'READ_ONLY=PASS'
          Write-Output 'ONE_PASS_ACQUISITION=PASS'
          Write-Output 'EXPECTED_SOURCES=PASS'
          Write-Output 'NO_DESKTOP_OUTPUT=PASS'
          Write-Output 'CLIPBOARD_RESULT=PASS'
          Write-Output 'DRIVE_RESULT=PASS_DESIGN_OUTPUT_READY_FOR_TRANSFER'
          Write-Output 'WRITE_ACTIONS=0'
          Write-Output 'FACEBOOK_META=0'
      - name: Fail closed fixtures
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($case in 'EMPTY','NOUI','NOSCHED'){
            $r=Join-Path $env:RUNNER_TEMP ('fail_'+$case)
            $o=Join-Path $r 'TMNM\OwnerConsole\CanonicalBridgeReview_579a2cf7a4da5591\tmnm_owner_console'
            New-Item -ItemType Directory -Force (Join-Path $o 'static'),(Join-Path $r 'TMNM\LocalWorker\app')|Out-Null
            if($case -ne 'EMPTY'){
              Set-Content (Join-Path $o 'app.py') "REVIEW_READY OWNER_APPROVED" -Encoding UTF8
              Set-Content (Join-Path $o 'owner_workflow.py') "OWNER_APPROVED" -Encoding UTF8
            }
            if($case -eq 'NOSCHED'){Set-Content (Join-Path $o 'static\app.js') "REVIEW_READY" -Encoding UTF8}
            if($case -eq 'NOUI'){Set-Content (Join-Path $r 'TMNM\LocalWorker\app\scheduler.py') "selected_publish_utc SCHEDULED" -Encoding UTF8}
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File engineering/batchd11/ACQUIRE_1_1_SOURCE.ps1 -TestRoot $r
            $childExit=$LASTEXITCODE
            if($childExit -eq 0){throw "FAIL_CLOSED_FAILED:$case"}
            $global:LASTEXITCODE=0
          }
          Write-Output 'EMPTY_MISSING_OUTPUT_TESTS=PASS'
          Write-Output 'FAILURE_PATHS_FAIL_CLOSED=PASS'

      - name: Gate E package exact validated source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=(Resolve-Path 'engineering/batchd11/ACQUIRE_1_1_SOURCE.ps1').Path
          $stage=Join-Path $env:RUNNER_TEMP 'gate_e_final'
          $expand=Join-Path $env:RUNNER_TEMP 'gate_e_expand'
          $zip=Join-Path $env:RUNNER_TEMP 'TMNM_1_1_EXACT_SOURCE_ACQUISITION_OWNER_ROUTE_FINAL.zip'
          New-Item -ItemType Directory -Force $stage|Out-Null
          Copy-Item -LiteralPath $src -Destination (Join-Path $stage 'ACQUIRE_1_1_SOURCE.ps1')
          Compress-Archive -LiteralPath (Join-Path $stage 'ACQUIRE_1_1_SOURCE.ps1') -DestinationPath $zip
          $final=(Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          Expand-Archive -LiteralPath $zip -DestinationPath $expand
          $a=(Get-FileHash -Algorithm SHA256 -LiteralPath $src).Hash
          $b=(Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $expand 'ACQUIRE_1_1_SOURCE.ps1')).Hash
          if($a -ne $b){throw 'ZIP_CONTENT_MATCH_FAIL'}
          Write-Output 'SOURCE_UNCHANGED=PASS'
          Write-Output 'ZIP_CONTENT_MATCH=PASS'
          Write-Output ('FINAL_ZIP_SHA256='+$final)
          "FINAL_ZIP_SHA256=$final" | Out-File -FilePath (Join-Path $env:RUNNER_TEMP 'gate_e_sha.txt') -Encoding ascii
      - name: Upload Gate E final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TMNM-1-1-GATE-E-FINAL
          path: ${{ runner.temp }}/TMNM_1_1_EXACT_SOURCE_ACQUISITION_OWNER_ROUTE_FINAL.zip
          if-no-files-found: error
          compression-level: 0

      - name: Owner launcher integration validation and final package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script='engineering/batchd11/ACQUIRE_1_1_SOURCE.ps1'
          $launcher='engineering/batchd11/RUN_TMNM_ACQUISITION.cmd'
          $scriptSha=(Get-FileHash $script -Algorithm SHA256).Hash.ToLowerInvariant()
          if($scriptSha -ne '319e5b30c29584f50090e50ab4135517ce1112d2dc76ac5a17d3828e231f9bf0'){throw 'ORIGINAL_VALIDATED_SCRIPT_CHANGED'}
          $launcherSha=(Get-FileHash $launcher -Algorithm SHA256).Hash.ToLowerInvariant()
          $fixture=Join-Path $env:RUNNER_TEMP 'launcher_fixture'
          $pkg=Join-Path $fixture 'package'
          $o=Join-Path $env:LOCALAPPDATA 'TMNM\OwnerConsole\CanonicalBridgeReview_579a2cf7a4da5591\tmnm_owner_console'
          New-Item -ItemType Directory -Force $pkg,(Join-Path $o 'static'),(Join-Path $env:LOCALAPPDATA 'TMNM\LocalWorker\app')|Out-Null
          Copy-Item $script,$launcher $pkg
          Set-Content (Join-Path $o 'app.py') "REVIEW_READY OWNER_APPROVED WRITE_DISABLED_MASTER_HOLD /api/workflow/approve schedule" -Encoding UTF8
          Set-Content (Join-Path $o 'owner_workflow.py') "OWNER_APPROVED schedule" -Encoding UTF8
          Set-Content (Join-Path $o 'static\app.js') "REVIEW_READY OWNER_APPROVED schedule" -Encoding UTF8
          Set-Content (Join-Path $o 'static\index.html') "ui" -Encoding UTF8
          Set-Content (Join-Path $env:LOCALAPPDATA 'TMNM\LocalWorker\app\scheduler.py') "selected_publish_utc SCHEDULED NOT_QUEUED scheduler" -Encoding UTF8
          $launcherPath=(Resolve-Path (Join-Path $pkg 'RUN_TMNM_ACQUISITION.cmd')).Path
          $cmdLine='echo.|call "'+$launcherPath+'"'
          $out=cmd.exe /d /c $cmdLine 2>&1 | Out-String
          if($LASTEXITCODE -ne 0){throw "ONE_CLICK_LAUNCH_FAIL:$out"}
          if($out -notmatch 'STATUS=PASS'){throw 'VISIBLE_PASS_FAIL_MISSING'}
          $clip=Get-Clipboard -Raw
          if($clip -notmatch 'STATUS=PASS_READ_ONLY_ACQUISITION'){throw 'CLIPBOARD_RESULT_FAIL'}
          if(Test-Path (Join-Path $env:USERPROFILE 'Desktop\TMNM_1_1_EXACT_SOURCE_ACQUISITION_RESULT.zip')){throw 'DESKTOP_OUTPUT_FOUND'}
          $final=Join-Path $env:RUNNER_TEMP 'TMNM_1_1_EXACT_SOURCE_ACQUISITION_OWNER_ONE_CLICK_FINAL.zip'
          Compress-Archive -LiteralPath (Join-Path $pkg 'ACQUIRE_1_1_SOURCE.ps1'),(Join-Path $pkg 'RUN_TMNM_ACQUISITION.cmd') -DestinationPath $final
          $expand=Join-Path $env:RUNNER_TEMP 'launcher_final_expand'
          Expand-Archive $final $expand
          if((Get-FileHash (Join-Path $expand 'ACQUIRE_1_1_SOURCE.ps1') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $scriptSha){throw 'FINAL_SCRIPT_MISMATCH'}
          if((Get-FileHash (Join-Path $expand 'RUN_TMNM_ACQUISITION.cmd') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $launcherSha){throw 'FINAL_LAUNCHER_MISMATCH'}
          $finalSha=(Get-FileHash $final -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output 'ORIGINAL_VALIDATED_SCRIPT_UNCHANGED=PASS'
          Write-Output 'ONE_CLICK_LAUNCH=PASS'
          Write-Output 'NO_MANUAL_POWERSHELL=PASS'
          Write-Output 'CLIPBOARD_RESULT=PASS'
          Write-Output 'VISIBLE_PASS_FAIL=PASS'
          Write-Output 'NO_DESKTOP_OUTPUT=PASS'
          Write-Output 'WRITE_ACTIONS=0'
          Write-Output 'FACEBOOK_META=0'
          Write-Output "SCRIPT_SHA256=$scriptSha"
          Write-Output "LAUNCHER_SHA256=$launcherSha"
          Write-Output "FINAL_SHA256=$finalSha"
      - name: Upload one-click owner final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TMNM-1-1-OWNER-ONE-CLICK-FINAL
          path: ${{ runner.temp }}/TMNM_1_1_EXACT_SOURCE_ACQUISITION_OWNER_ONE_CLICK_FINAL.zip
          if-no-files-found: error
          compression-level: 0
