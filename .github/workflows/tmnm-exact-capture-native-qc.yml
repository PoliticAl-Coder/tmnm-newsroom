name: Exact capture public synthetic native QC
on:
  push:
    paths:
      - '.github/workflows/tmnm-exact-capture-native-qc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Native Windows Python AST and privacy tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'NOT_PS51' }
          python --version
          Push-Location tests/synthetic_capture
          python -B -m unittest discover -p 'TEST_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'NATIVE_TEST_FAIL' }
          Pop-Location
          Write-Output 'PASS: synthetic actual capture module suite'
