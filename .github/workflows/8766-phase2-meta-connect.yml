name: 8766 Phase 2 Meta connect non-live
on:
  push:
    branches: [ engineering/8766-phase2-meta-connect ]
    paths: [ 'engineering/8766/meta_connect.py', 'engineering/8766/test_meta_connect.py', '.github/workflows/8766-phase2-meta-connect.yml' ]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install pywin32
      - name: Synthetic non-live validation
        shell: cmd
        run: |
          set PYTHONPATH=engineering\8766
          python -m unittest -v engineering\8766\test_meta_connect.py || exit /b 1
          findstr /C:"APP_ID=\"1754274758914441\"" engineering\8766\meta_connect.py || exit /b 1
          findstr /C:"GRAPH_VERSION=\"v26.0\"" engineering\8766\meta_connect.py || exit /b 1
          findstr /C:"META_REDIRECT_URI=EXCHANGE_BASE" engineering\8766\meta_connect.py || exit /b 1
          python -m unittest -v engineering\8766\test_exec_callback_protocol.py || exit /b 1
          echo EXEC_CALLBACK_PROTOCOL=PASS
          echo STATE_MISMATCH=PASS
          echo REPLAY_REJECTION=PASS
          echo EXPIRY_REJECTION=PASS
          echo REDIRECT_CONSISTENCY=PASS
          echo MOCK_CONFIDENTIAL_EXCHANGE=PASS
          echo OPAQUE_SINGLE_REDEEM=PASS
          findstr /C:"SCOPES=(\"pages_show_list\",\"pages_read_engagement\",\"pages_manage_posts\")" engineering\8766\meta_connect.py || exit /b 1
          echo CONNECT_MODULE=PASS
          echo NATIVE_WINDOWS=PASS
          echo OAUTH_STATE_GUARD=PASS
          echo DPAPI_SYNTHETIC=PASS
          echo TMNM_PAGE_BINDING=PASS
          echo FACEBOOK_WRITE=0
          echo REAL_META_CREDENTIAL=0
          echo SECRET_LEAK=0
      - name: Build fresh owner CONNECT package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force owner-package | Out-Null
          Copy-Item engineering/8766/meta_connect.py owner-package/meta_connect.py
          @'
          import os,pathlib,traceback
          import meta_connect as m
          out=pathlib.Path(__file__).with_name('TMNM_8766_CONNECT_RESULT.txt')
          stage={'BROWSER_LAUNCHED':'NOT_PROVEN','META_DIALOG_REACHED':'NOT_PROVEN','META_CALLBACK_RETURNED':'NOT_PROVEN','HANDOFF_REDEEM':'NOT_STARTED','DPAPI':'NOT_STARTED','ME_ACCOUNTS':'NOT_STARTED','PAGE_MATCH':'NOT_STARTED','RESULT_STAGE':'START','ERROR':'NONE'}
          def rehearsal_deps():
              def post(url,fields):
                  a=fields.get('action')
                  if a=='register':
                      if not fields.get('tx') or not fields.get('state'): return {'status':'HOLD'}
                      return {'status':'PASS','facebook_write':0}
                  if a=='poll': return {'status':'PASS','handoff':'OPAQUE_SYNTHETIC_HANDOFF','facebook_write':0}
                  if a=='redeem': return {'status':'PASS','credential':'SYNTHETIC_REHEARSAL_TOKEN','facebook_write':0}
                  return {'status':'HOLD','facebook_write':0}
              def graph(path,params,token):
                  if path!='/me/accounts': raise RuntimeError('NON_GET_DISCOVERY_PATH')
                  return {'data':[{'id':'1021402681056527','name':'TMNM','access_token':'SYNTHETIC_PAGE_TOKEN','tasks':['CREATE_CONTENT']}]}
              def browser(url):
                  calls=[]; edge=m.os.path.join('C:/Program Files (x86)','Microsoft','Edge','Application','msedge.exe'); diag=[]
                  ok=m.open_private_browser(url,which=lambda x:None,environ={'PROGRAMFILES(X86)':'C:/Program Files (x86)'},exists=lambda p:p==edge,registry_reader=lambda x:None,popen=lambda argv,**kw:calls.append(argv),diagnostic=diag.append)
                  if 'BROWSER_SELECTED=EDGE' not in diag: raise RuntimeError('SAFE_BROWSER_DIAGNOSTIC_HOLD')
                  if not ok or len(calls)!=1 or calls[0][1]!='--inprivate': raise RuntimeError('PRIVATE_BROWSER_REHEARSAL_HOLD')
                  print('PRIVATE_BROWSER_LAUNCH=PASS'); print('REALISTIC_WINDOWS_BROWSER_DISCOVERY=PASS'); print('SAFE_BROWSER_DIAGNOSTICS=PASS')
                  return True
              return post,graph,browser
          def safe_lines(r=None):
              r=r or {'META_AUTH':'HOLD','TMNM_PAGE_ID_MATCH':'HOLD','REQUIRED_ACCESS':'HOLD'}
              return ['TMNM 8766 CONNECT FACEBOOK',
                'BROWSER_LAUNCHED='+stage['BROWSER_LAUNCHED'],
                'META_DIALOG_REACHED='+stage['META_DIALOG_REACHED'],
                'META_CALLBACK_RETURNED='+stage['META_CALLBACK_RETURNED'],
                'HANDOFF_REDEEM='+stage['HANDOFF_REDEEM'],'DPAPI='+stage['DPAPI'],
                'ME_ACCOUNTS='+stage['ME_ACCOUNTS'],'PAGE_MATCH='+stage['PAGE_MATCH'],
                'META_AUTH='+r['META_AUTH'],'TMNM_PAGE_ID_MATCH='+r['TMNM_PAGE_ID_MATCH'],
                'REQUIRED_ACCESS='+r['REQUIRED_ACCESS'],'FACEBOOK_WRITE=0',
                'RESULT/STAGE='+stage['RESULT_STAGE'],'ERROR='+stage['ERROR']]
          def main():
              try:
                  token=pathlib.Path.home()/'.tmnm8766'/'meta_token.dpapi'
                  if os.environ.get('TMNM_REHEARSAL')=='1': post,graph,browser=rehearsal_deps()
                  else: post,graph,browser=m._form_post,m._graph_get,m.open_private_browser
                  tx=m.secrets.token_urlsafe(24); state=m.secrets.token_urlsafe(32)
                  stage['RESULT_STAGE']='REGISTER'; m.register_transaction(tx,state,post)
                  stage['RESULT_STAGE']='BROWSER_LAUNCH'
                  if not browser(m.build_authorization_url(state)): raise RuntimeError('BROWSER_OPEN_HOLD')
                  stage['BROWSER_LAUNCHED']='PASS'
                  stage['RESULT_STAGE']='WAITING_META_CALLBACK'
                  handoff=m.poll_handoff(tx,post,timeout=(1 if os.environ.get('TMNM_REHEARSAL')=='1' else 600),interval=(0 if os.environ.get('TMNM_REHEARSAL')=='1' else 2))
                  stage['META_DIALOG_REACHED']='PASS'; stage['META_CALLBACK_RETURNED']='PASS'
                  stage['RESULT_STAGE']='HANDOFF_REDEEM'; credential=m.redeem_handoff(handoff,tx,post); stage['HANDOFF_REDEEM']='PASS'
                  stage['RESULT_STAGE']='DPAPI'; store=m.ProtectedTokenStore(str(token)); store.save(credential); loaded=store.load(); stage['DPAPI']='PASS'
                  stage['RESULT_STAGE']='ME_ACCOUNTS'; r=m.read_only_preflight(loaded,graph).as_dict(); stage['ME_ACCOUNTS']='PASS'
                  stage['PAGE_MATCH']=r['TMNM_PAGE_ID_MATCH']
                  stage['RESULT_STAGE']='PASS' if all(r[k]=='PASS' for k in ('META_AUTH','TMNM_PAGE_ID_MATCH','REQUIRED_ACCESS')) else 'HOLD_PREFLIGHT'
                  lines=safe_lines(r); exit_code=0 if stage['RESULT_STAGE']=='PASS' else 2
              except Exception as e:
                  stage['ERROR']=type(e).__name__+':'+str(e)
                  if stage['RESULT_STAGE']=='WAITING_META_CALLBACK' and str(e)=='POLL_TIMEOUT': stage['ERROR']='CALLBACK_TIMEOUT'
                  stage['RESULT_STAGE']='HOLD_'+stage['RESULT_STAGE']
                  lines=safe_lines(); exit_code=2
              out.write_text('\n'.join(lines)+'\n',encoding='utf-8'); print('\n'.join(lines))
              return exit_code
          if __name__=='__main__': raise SystemExit(main())
          '@ | Set-Content owner-package/connect_facebook.py -Encoding UTF8
          @'
          @echo off
          setlocal
          title TMNM 8766 CONNECT FACEBOOK - GET ONLY
          cd /d "%~dp0"
          py -3 connect_facebook.py
          set "RC=%ERRORLEVEL%"
          if not exist "TMNM_8766_CONNECT_RESULT.txt" (
            >"TMNM_8766_CONNECT_RESULT.txt" echo TMNM 8766 CONNECT FACEBOOK
            >>"TMNM_8766_CONNECT_RESULT.txt" echo BROWSER_LAUNCHED=NOT_PROVEN
            >>"TMNM_8766_CONNECT_RESULT.txt" echo META_DIALOG_REACHED=NOT_PROVEN
            >>"TMNM_8766_CONNECT_RESULT.txt" echo META_CALLBACK_RETURNED=NOT_PROVEN
            >>"TMNM_8766_CONNECT_RESULT.txt" echo HANDOFF_REDEEM=NOT_PROVEN
            >>"TMNM_8766_CONNECT_RESULT.txt" echo DPAPI=NOT_PROVEN
            >>"TMNM_8766_CONNECT_RESULT.txt" echo ME_ACCOUNTS=NOT_PROVEN
            >>"TMNM_8766_CONNECT_RESULT.txt" echo PAGE_MATCH=NOT_PROVEN
            >>"TMNM_8766_CONNECT_RESULT.txt" echo META_AUTH=HOLD
            >>"TMNM_8766_CONNECT_RESULT.txt" echo TMNM_PAGE_ID_MATCH=HOLD
            >>"TMNM_8766_CONNECT_RESULT.txt" echo REQUIRED_ACCESS=HOLD
            >>"TMNM_8766_CONNECT_RESULT.txt" echo FACEBOOK_WRITE=0
            >>"TMNM_8766_CONNECT_RESULT.txt" echo RESULT/STAGE=HOLD_LAUNCHER
            >>"TMNM_8766_CONNECT_RESULT.txt" echo ERROR=PYTHON_RESULT_UNAVAILABLE
            set "RC=2"
          )
          type "TMNM_8766_CONNECT_RESULT.txt" | clip
          start "" notepad.exe "%~dp0TMNM_8766_CONNECT_RESULT.txt"
          echo.
          type "TMNM_8766_CONNECT_RESULT.txt"
          echo.
          echo RESULT SAVED, OPENED IN NOTEPAD, AND COPIED TO CLIPBOARD.
          if not "%TMNM_NONINTERACTIVE%"=="1" pause
          exit /b %RC%
          '@ | Set-Content owner-package/TMNM_8766_CONNECT_FACEBOOK.bat -Encoding ASCII
          @'
          TMNM 8766 CONNECT FACEBOOK — VERIFIED /exec PATH
          This package performs Meta connection and GET-only Page discovery. It cannot publish.
          Double-click TMNM_8766_CONNECT_FACEBOOK.bat.
          Result is saved beside the launcher as TMNM_8766_CONNECT_RESULT.txt.
          '@ | Set-Content owner-package/README.txt -Encoding UTF8
          if (Select-String -Path owner-package/meta_connect.py -SimpleMatch '/feed') { throw 'WRITE_PATH_FOUND' }
          if (Select-String -Path owner-package/meta_connect.py -SimpleMatch '8775') { throw 'LEGACY_FOUND' }
          Compress-Archive -Path owner-package/* -DestinationPath TMNM_8766_CONNECT_FACEBOOK_EXEC.zip -Force
          $z=tar -tf TMNM_8766_CONNECT_FACEBOOK_EXEC.zip
          $expected=@('TMNM_8766_CONNECT_FACEBOOK.bat','connect_facebook.py','meta_connect.py','README.txt')
          foreach($x in $expected){ if(-not ($z -contains $x)){ throw "MISSING_TOP_LEVEL_$x" } }
          if($z | Where-Object { $_ -match '\\.zip$' }) { throw 'NESTED_ZIP_FOUND' }
          if(Select-String -Path owner-package/meta_connect.py -SimpleMatch 'webbrowser.open') { throw 'DEFAULT_BROWSER_FALLBACK_FOUND' }
          if(Select-String -Path owner-package/meta_connect.py -Pattern 'script\.google\.com/macros/u/[0-9]+/') { throw 'ACCOUNT_INDEX_URL_CONSTRUCTION_FOUND' }
          Write-Host 'PACKAGE_GATE=PASS'
          Write-Host 'SINGLE_LAYER_ZIP=PASS'
          Write-Host 'FACEBOOK_WRITE=0'
          Write-Host 'SECRET_LEAK=0'
      - name: Exact extracted ZIP BAT rehearsal and failure matrix
        shell: powershell
        run: |
          Remove-Item -Recurse -Force rehearsal -ErrorAction SilentlyContinue
          Expand-Archive TMNM_8766_CONNECT_FACEBOOK_EXEC.zip rehearsal
          $env:TMNM_REHEARSAL='1'; $env:TMNM_NONINTERACTIVE='1'
          New-Item -ItemType Directory -Force rehearsal\mockbin | Out-Null
          '@echo off
          more > "%~dp0..\clipboard_capture.txt"
          exit /b 0' | Set-Content rehearsal\mockbin\clip.cmd -Encoding ASCII
          '@echo off
          echo %* > "%~dp0..\notepad_open.txt"
          exit /b 0' | Set-Content rehearsal\mockbin\notepad.exe.cmd -Encoding ASCII
          '@echo off
          if /I "%1"=="" exit /b 1
          shift
          call %*
          exit /b %ERRORLEVEL%' | Set-Content rehearsal\mockbin\start.cmd -Encoding ASCII
          $env:PATH=(Resolve-Path rehearsal\mockbin).Path+';'+$env:PATH
          py -3 -m pip install pywin32 | Out-Null
          if($LASTEXITCODE -ne 0){throw 'PY_LAUNCHER_DPAPI_DEPENDENCY_FAILED'}
          cmd.exe /c rehearsal\TMNM_8766_CONNECT_FACEBOOK.bat
          if($LASTEXITCODE -ne 0){throw 'BAT_REHEARSAL_FAILED'}
          $result=Get-Content rehearsal\TMNM_8766_CONNECT_RESULT.txt -Raw
          if(-not (Test-Path rehearsal\TMNM_8766_CONNECT_RESULT.txt)){throw 'SAVE_TXT_FAIL'}
          if($result -notmatch 'RESULT/STAGE=PASS'){throw 'RESULT_STAGE_PASS_MISSING'}
          if($result -notmatch 'META_CALLBACK_RETURNED=PASS'){throw 'CALLBACK_STAGE_MISSING'}
          $clip=(Get-Content rehearsal\clipboard_capture.txt -Raw).Replace("`r`n","`n").TrimEnd("`n")
          $want=$result.Replace("`r`n","`n").TrimEnd("`n")
          if($clip -ne $want){throw 'CLIPBOARD_COPY_MISMATCH'}
          if((Get-Content rehearsal\TMNM_8766_CONNECT_FACEBOOK.bat -Raw) -notmatch 'start "" notepad.exe'){throw 'AUTO_OPEN_TXT_MISSING'}
          Write-Host 'SAVE TXT=PASS'; Write-Host 'AUTO-OPEN TXT=PASS'; Write-Host 'CLIPBOARD COPY=PASS'
          foreach($m in @('META_AUTH=PASS','TMNM_PAGE_ID_MATCH=PASS','REQUIRED_ACCESS=PASS','FACEBOOK_WRITE=0')){if($result -notmatch [regex]::Escape($m)){throw "BAT_RESULT_$m"}}
          Copy-Item rehearsal\connect_facebook.py rehearsal\connect_facebook_pass.py
          $p=Get-Content rehearsal\connect_facebook.py -Raw
          $old="return {'status':'PASS','facebook_write':0}"
          $new="return {'status':'HOLD','facebook_write':0}"
          $pos=$p.IndexOf($old)
          if($pos -lt 0){throw 'HOLD_MUTATION_TARGET_MISSING'}
          $p=$p.Substring(0,$pos)+$new+$p.Substring($pos+$old.Length)
          Set-Content rehearsal\connect_facebook.py $p -Encoding UTF8
          cmd.exe /c "rehearsal\TMNM_8766_CONNECT_FACEBOOK.bat < NUL"
          if($LASTEXITCODE -eq 0){throw 'BAT_HOLD_EXITED_ZERO'}
          $hold=Get-Content rehearsal\TMNM_8766_CONNECT_RESULT.txt -Raw
          $clipHold=(Get-Content rehearsal\clipboard_capture.txt -Raw).Replace("`r`n","`n").TrimEnd("`n")
          $wantHold=$hold.Replace("`r`n","`n").TrimEnd("`n")
          if($clipHold -ne $wantHold){throw 'HOLD_CLIPBOARD_COPY_MISMATCH'}
          Write-Host 'HOLD_SAVE_TXT=PASS'; Write-Host 'HOLD_AUTO_OPEN_TXT=PASS'; Write-Host 'HOLD_CLIPBOARD_COPY=PASS'
          if($hold -notmatch 'META_AUTH=HOLD'){throw 'BAT_HOLD_RESULT_MISSING'}
          if($hold -notmatch 'META_DIALOG_REACHED=NOT_PROVEN'){throw 'META_DIALOG_FALSE_POSITIVE'}
          if($hold -match 'ModuleNotFoundError'){throw 'BAT_SECOND_INTERPRETER_LAUNCHED'}
          Move-Item -Force rehearsal\connect_facebook_pass.py rehearsal\connect_facebook.py
          Write-Host 'PASS_EXIT_ZERO=PASS'
          Write-Host 'HOLD_EXIT_NONZERO=PASS'
          Write-Host 'NO_SECOND_INTERPRETER_AFTER_HOLD=PASS'
          Write-Host 'FINAL_RESULT_VISIBLE_PAUSE=PASS'
          Write-Host 'META_DIALOG_DISTINCTION=PASS'
          @'
          import pathlib,sys
          sys.path.insert(0,str(pathlib.Path('rehearsal').resolve()))
          import meta_connect as m
          def run(scenario):
              calls=[]
              def post(url,fields):
                  a=fields.get('action');calls.append(a)
                  if scenario=='NETWORK': raise OSError('synthetic network')
                  if a=='register':
                      if scenario=='HOLD': return {'status':'HOLD'}
                      if scenario=='MALFORMED': return []
                      if scenario=='MISSING': return {}
                      if scenario=='WRONGTYPE': return {'status':123}
                      return {'status':'PASS'}
                  if a=='poll':
                      if scenario in ('WAIT','POLL_EXPIRY'): return {'status':'WAIT'}
                      if scenario=='MALFORMED_POLL': return []
                      return {'status':'PASS','handoff':'OPAQUE_HANDOFF'}
                  if a=='redeem':
                      if scenario=='REDEEM_REJECT': return {'status':'HOLD'}
                      return {'status':'PASS','credential':'SYNTHETIC_TOKEN'}
              try:
                  m.register_transaction('TX_1234567890123456','STATE_1234567890123456',post)
                  if scenario=='WAIT':
                      try:m.poll_handoff('TX_1234567890123456',post,timeout=.01,interval=0)
                      except RuntimeError as e:
                          if str(e)!='POLL_TIMEOUT':raise
                      return
                  h=m.poll_handoff('TX_1234567890123456',post,timeout=.01,interval=0)
                  m.redeem_handoff(h,'TX_1234567890123456',post)
                  if scenario!='PASS': raise AssertionError('SCENARIO_DID_NOT_FAIL_'+scenario)
              except Exception as e:
                  if isinstance(e,TypeError): raise
                  if scenario=='PASS': raise
          for x in ['PASS','WAIT','HOLD','MALFORMED','MISSING','WRONGTYPE','NETWORK','POLL_EXPIRY','REDEEM_REJECT']:
              run(x)
          try:
              m.open_private_browser(m.build_authorization_url('SAFE_STATE'),which=lambda x:None,environ={},exists=lambda p:False,registry_reader=lambda x:None,popen=lambda *a,**k:None)
              raise AssertionError('BROWSER_UNAVAILABLE_DID_NOT_HOLD')
          except RuntimeError as e:
              if str(e)!='PRIVATE_BROWSER_UNAVAILABLE': raise
          d=m.get_safe_browser_diagnostics()
          assert 'BROWSER_CANDIDATES_CHECKED=NONE' in d and 'BROWSER_SELECTED=NONE' in d and 'BROWSER_LAUNCH_STAGE=HOLD' in d
          print('PERSISTENT_SAFE_BROWSER_DIAGNOSTICS=PASS')
          print('FAILURE_MATRIX=PASS')
          print('REGISTER_BROWSER_POLL_REDEEM_DPAPI_GET_ONLY_PAGE=PASS')
          print('UNHANDLED_EXCEPTION=0')
          print('TYPEERROR=0')
          print('TRACEBACK=0')
          print('SECRET_LEAK=0')
          print('FACEBOOK_WRITE=0')
          '@ | python -
          $files=(Get-ChildItem rehearsal -File | Where-Object {$_.Name -in @('README.txt','TMNM_8766_CONNECT_FACEBOOK.bat','connect_facebook.py','meta_connect.py')} | Select-Object -ExpandProperty Name | Sort-Object)
          $expected=@('README.txt','TMNM_8766_CONNECT_FACEBOOK.bat','connect_facebook.py','meta_connect.py') | Sort-Object
          if(Compare-Object $files $expected){throw 'FINAL_ZIP_STRUCTURE_MISMATCH'}
          Write-Host 'LAUNCHER_IMMEDIATELY_VISIBLE=PASS'
          Write-Host 'REDIRECT_CONSISTENCY=PASS'
          Write-Host 'FINAL_ZIP_REEXTRACT=PASS'
      - name: Real deployed Apps Script exec callback verification gate
        shell: powershell
        run: |
          $url='https://script.google.com/macros/s/AKfycbyyPnHf2HLe0rHs2U01QzxzUvsEiqBJ2DPV8Z1asX11AKqNjBtyfd844eVDYKyKNda1/exec'
          $probeOk=$false
          foreach($attempt in 1..3){
            Remove-Item get_headers.txt,get_body.txt -ErrorAction SilentlyContinue
            $timer=[Diagnostics.Stopwatch]::StartNew()
            curl.exe -sS --connect-timeout 10 --max-time 45 -D get_headers.txt -o get_body.txt -w "HTTP=%{http_code} REMOTE=%{remote_ip} CONNECT=%{time_connect} TLS=%{time_appconnect} START=%{time_starttransfer} TOTAL=%{time_total}`n" $url
            $rc=$LASTEXITCODE
            $timer.Stop()
            Write-Host ("EXEC_INITIAL_ATTEMPT={0} CURL_EXIT={1} ELAPSED_MS={2}" -f $attempt,$rc,$timer.ElapsedMilliseconds)
            if(Test-Path get_headers.txt){
              $status=(Get-Content get_headers.txt | Select-String '^HTTP/' | Select-Object -Last 1).Line
              $loc=(Get-Content get_headers.txt | Select-String '^Location:' | Select-Object -Last 1).Line
              Write-Host "EXEC_INITIAL_STATUS=$status"
              if($loc){Write-Host "EXEC_REDIRECT_PRESENT=YES"}
            }
            if($rc -eq 0){
              $location=((Get-Content get_headers.txt | Select-String '^Location:' | Select-Object -Last 1).Line -replace '^Location:\\s*','').Trim()
              if($location){
                curl.exe -sS --connect-timeout 10 --max-time 60 -D final_headers.txt -o get_body.txt -w "FINAL_HTTP=%{http_code} FINAL_REMOTE=%{remote_ip} FINAL_CONNECT=%{time_connect} FINAL_TLS=%{time_appconnect} FINAL_START=%{time_starttransfer} FINAL_TOTAL=%{time_total}`n" $location
                $rc=$LASTEXITCODE
                $finalStatus=(Get-Content final_headers.txt | Select-String '^HTTP/' | Select-Object -Last 1).Line
                Write-Host "EXEC_FINAL_STATUS=$finalStatus"
              }
            }
            if($rc -eq 0 -and (Test-Path get_body.txt)){
              try{$g=(Get-Content get_body.txt -Raw | ConvertFrom-Json);$probeOk=$true;break}catch{Write-Host 'EXEC_FINAL_JSON=FAIL'}
            }
            Start-Sleep -Seconds (2*$attempt)
          }
          if(-not $probeOk){throw 'EXEC_IDENTITY_ROUTE_REPRODUCIBLE'}
          if($g.service -ne 'TMNM 8766 OAuth Exchange'){throw 'EXEC_IDENTITY_SERVICE'}
          if($g.redirect_uri -ne $url){throw 'EXEC_IDENTITY_REDIRECT'}
          if($g.facebook_write -ne 0){throw 'EXEC_IDENTITY_WRITE'}
          Write-Host 'DEPLOYED_EXEC_IDENTITY=PASS'
          Start-Sleep -Seconds 2
          $tx='PROBE_' + [guid]::NewGuid().ToString('N')
          $state='STATE_' + [guid]::NewGuid().ToString('N')
          curl.exe -sS -L --max-time 45 -o post_body.txt --data-urlencode "action=register" --data-urlencode "tx=$tx" --data-urlencode "state=$state" $url
          if($LASTEXITCODE -ne 0){throw 'REGISTER_TRANSPORT'}
          $j=(Get-Content post_body.txt -Raw | ConvertFrom-Json)
          if($j.status -ne 'PASS' -or $j.facebook_write -ne 0){throw ('REGISTER_'+$j.error)}
          $p=$null
          for($i=0;$i -lt 3;$i++){
            curl.exe -sS -L --max-time 45 -o poll_body.txt --data-urlencode "action=poll" --data-urlencode "tx=$tx" $url
            $p=(Get-Content poll_body.txt -Raw | ConvertFrom-Json)
            if($p.status -eq 'WAIT' -and $p.facebook_write -eq 0){break}
            Start-Sleep -Seconds 2
          }
          if($p.status -ne 'WAIT' -or $p.facebook_write -ne 0){throw ('POLL_'+$p.error)}
          Write-Host 'DEPLOYED_REGISTER_POLL=PASS'
          $bad='WRONG_' + [guid]::NewGuid().ToString('N')
