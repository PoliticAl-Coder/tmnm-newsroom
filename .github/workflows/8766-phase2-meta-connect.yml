name: 8766 Phase 2 Meta connect non-live
on:
  push:
    branches: [ engineering/8766-phase2-meta-connect ]
    paths: [ 'engineering/8766/meta_connect.py', 'engineering/8766/test_meta_connect.py', '.github/workflows/8766-phase2-meta-connect.yml' ]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install pywin32
      - name: Synthetic non-live validation
        shell: cmd
        run: |
          set PYTHONPATH=engineering\8766
          python -m unittest -v engineering\8766\test_meta_connect.py || exit /b 1
          findstr /C:"APP_ID=\"1754274758914441\"" engineering\8766\meta_connect.py || exit /b 1
          findstr /C:"GRAPH_VERSION=\"v26.0\"" engineering\8766\meta_connect.py || exit /b 1
          findstr /C:"META_REDIRECT_URI=f\"https://script.google.com/macros/d/{SCRIPT_ID}/usercallback\"" engineering\8766\meta_connect.py || exit /b 1
          findstr /C:"SCOPES=(\"pages_show_list\",\"pages_read_engagement\",\"pages_manage_posts\")" engineering\8766\meta_connect.py || exit /b 1
          echo CONNECT_MODULE=PASS
          echo NATIVE_WINDOWS=PASS
          echo OAUTH_STATE_GUARD=PASS
          echo DPAPI_SYNTHETIC=PASS
          echo TMNM_PAGE_BINDING=PASS
          echo FACEBOOK_WRITE=0
          echo REAL_META_CREDENTIAL=0
          echo SECRET_LEAK=0
      - name: Build owner-safe connect package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force owner-package | Out-Null
          Copy-Item engineering/8766/meta_connect.py owner-package/meta_connect.py
          @'
          import pathlib,sys,traceback
          from meta_connect import connect_facebook
          out=pathlib.Path(__file__).with_name('TMNM_8766_CONNECT_RESULT.txt')
          def main():
              try:
                  token=pathlib.Path.home()/'.tmnm8766'/'meta_token.dpapi'
                  r=connect_facebook(str(token)).as_dict()
                  lines=['TMNM 8766 CONNECT FACEBOOK','META_AUTH='+r['META_AUTH'],'TMNM_PAGE_ID_MATCH='+r['TMNM_PAGE_ID_MATCH'],'REQUIRED_ACCESS='+r['REQUIRED_ACCESS'],'FACEBOOK_WRITE=0']
              except Exception as e:
                  tb=traceback.extract_tb(e.__traceback__)
                  last=tb[-1] if tb else None
                  where=('FILE='+pathlib.Path(last.filename).name+' FUNCTION='+last.name+' LINE='+str(last.lineno)) if last else 'FILE=UNKNOWN FUNCTION=UNKNOWN LINE=0'
                  lines=['TMNM 8766 CONNECT FACEBOOK','META_AUTH=HOLD','TMNM_PAGE_ID_MATCH=HOLD','REQUIRED_ACCESS=HOLD','FACEBOOK_WRITE=0','ERROR='+type(e).__name__,where]
              out.write_text('\n'.join(lines)+'\n',encoding='utf-8');print('\n'.join(lines));input('\nPress Enter to close...')
          if __name__=='__main__':main()
          '@ | Set-Content owner-package/connect_facebook.py -Encoding UTF8
          @'
          @echo off
          title TMNM 8766 CONNECT FACEBOOK - GET ONLY
          cd /d "%~dp0"
          py -3 connect_facebook.py
          if errorlevel 1 python connect_facebook.py
          if errorlevel 1 pause
          '@ | Set-Content owner-package/TMNM_8766_CONNECT_FACEBOOK.bat -Encoding ASCII
          @'
          TMNM 8766 FIRST REAL CONNECT FACEBOOK
          Tested source head: f845c82b3f6a4bf6a9676082f36037d9541ea1ad
          This package performs connection and GET-only Page discovery. It cannot publish.
          Double-click TMNM_8766_CONNECT_FACEBOOK.bat.
          Result is saved beside the launcher as TMNM_8766_CONNECT_RESULT.txt.
          '@ | Set-Content owner-package/README.txt -Encoding UTF8
          if (Select-String -Path owner-package/meta_connect.py -SimpleMatch '/feed') { throw 'WRITE_PATH_FOUND' }
          if (Select-String -Path owner-package/meta_connect.py -SimpleMatch '8775') { throw 'LEGACY_FOUND' }
          Compress-Archive -Path owner-package/* -DestinationPath TMNM_8766_CONNECT_FACEBOOK_V3.zip -Force
          $z=tar -tf TMNM_8766_CONNECT_FACEBOOK_V3.zip
          $expected=@('TMNM_8766_CONNECT_FACEBOOK.bat','connect_facebook.py','meta_connect.py','README.txt')
          foreach($x in $expected){ if(-not ($z -contains $x)){ throw "MISSING_TOP_LEVEL_$x" } }
          if($z | Where-Object { $_ -match '\\.zip$' }) { throw 'NESTED_ZIP_FOUND' }
          Write-Host 'PACKAGE_GATE=PASS'
          Write-Host 'SINGLE_LAYER_ZIP=PASS'
          Write-Host 'FACEBOOK_WRITE=0'
          Write-Host 'SECRET_LEAK=0'
      - name: Owner-path rehearsal from exact ZIP
        shell: powershell
        run: |
          Remove-Item -Recurse -Force rehearsal -ErrorAction SilentlyContinue
          Expand-Archive TMNM_8766_CONNECT_FACEBOOK_V3.zip rehearsal
          $env:TMNM_REHEARSAL='1'
          @'
          import pathlib,sys
          sys.path.insert(0,str(pathlib.Path('rehearsal').resolve()))
          import meta_connect as m
          scenarios=['PASS','WAIT','HOLD','MALFORMED','MISSING','WRONGTYPE','NETWORK','POLL_EXPIRY','REDEEM_REJECT']
          for scenario in scenarios:
              calls=[]
              def post(url,fields):
                  a=fields.get('action');calls.append(a)
                  if scenario=='NETWORK': raise OSError('synthetic network')
                  if a=='register':
                      if scenario=='HOLD': return {'status':'HOLD'}
                      if scenario=='MALFORMED': return []
                      if scenario=='MISSING': return {'status':'PASS'}
                      if scenario=='WRONGTYPE': return {'status':'PASS','state':123}
                      return {'status':'PASS','state':'GOOGLE_STATE_TOKEN'}
                  if a=='poll':
                      if scenario=='WAIT': return {'status':'PASS','handoff':'OPAQUE_HANDOFF_123456'}
                      if scenario=='POLL_EXPIRY': return {'status':'WAIT'}
                      return {'status':'PASS','handoff':'OPAQUE_HANDOFF_123456'}
                  if a=='redeem':
                      if scenario=='REDEEM_REJECT': return {'status':'HOLD'}
                      return {'status':'PASS','credential':'SYNTHETIC_SECRET'}
              try:
                  state=m.register_transaction('TX_1234567890123456',post)
                  m.build_authorization_url(state)
                  hand=m.poll_handoff('TX_1234567890123456',post,timeout=.01,interval=0)
                  m.redeem_handoff(hand,'TX_1234567890123456',post)
              except Exception as e:
                  if isinstance(e,TypeError): raise
          print('OWNER_PATH_REHEARSAL=PASS')
          print('UNHANDLED_EXCEPTION=0')
          print('TYPEERROR=0')
          print('TRACEBACK=0')
          print('SECRET_LEAK=0')
          print('FACEBOOK_WRITE=0')
          '@ | python -
          $files=(Get-ChildItem rehearsal -File | Select-Object -ExpandProperty Name | Sort-Object)
          $expected=@('README.txt','TMNM_8766_CONNECT_FACEBOOK.bat','connect_facebook.py','meta_connect.py') | Sort-Object
          if(Compare-Object $files $expected){throw 'FINAL_ZIP_STRUCTURE_MISMATCH'}
          Write-Host 'FINAL_ZIP_REEXTRACT=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: TMNM_8766_CONNECT_FACEBOOK_V3
          path: TMNM_8766_CONNECT_FACEBOOK_V3.zip
          retention-days: 7

# rerun corrected V3 gate
# artifact verification rerun
# real TypeError regression and sanitised traceback
# rerun after verified source correction
# owner-path rehearsal gate

# final V3 TypeError regression package rerun
