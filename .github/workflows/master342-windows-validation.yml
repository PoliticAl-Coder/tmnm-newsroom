        run: |
          $ErrorActionPreference='Stop'
          $target='engineering/master877/MASTER877_PUBLISH_REFERENCE_OBSERVATION.ps1'
          $sha=(Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          $tokens=$null;$errors=$null
