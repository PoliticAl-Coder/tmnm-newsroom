name: MASTER342 native Windows engineering validation
on:
  push:
    branches:
      - engineering/master342-windows-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged MASTER342 archive
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'engineering/master342/TMNM_MASTER342_CORRECTED_STATIC_ONLY.zip'
          $expected = '0B08E6BF99CA37A64615657FA2589D1D90E60A905131357CBF6998336934A07F'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          Write-Output "MASTER342_SHA256=$actual"
          if ($actual -ne $expected) { throw "MASTER342_ARCHIVE_HASH_MISMATCH" }
      - name: Extract into path with spaces
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'MASTER342 Package With Spaces'
          Expand-Archive -LiteralPath 'engineering/master342/TMNM_MASTER342_CORRECTED_STATIC_ONLY.zip' -DestinationPath $dest
          "TMNM_MASTER342_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run isolated native Windows suite
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -B engineering/master342/test_master342_windows.py "$env:TMNM_MASTER342_DIR"
