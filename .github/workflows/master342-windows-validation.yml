          $firstCim=$body.IndexOf("Get-CimInstance",[StringComparison]::Ordinal)
          if($firstProgress -lt 0 -or $firstCim -lt 0 -or $firstProgress -gt $firstCim){throw 'BATCHD_IMMEDIATE_OUTPUT_FAIL'}
