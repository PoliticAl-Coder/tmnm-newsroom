          Write-Output 'OWNER_SHAPED_APP_BINDING_FIXTURE_PASS=true'
          Write-Output 'BOUNDED_RUNTIME_PASS=true'
          Write-Output 'IMMEDIATE_OUTPUT_PASS=true'
          Write-Output 'NO_DESKTOP_OUTPUT_PASS=true'
          New-Item -ItemType Directory -Force app_binding_package|Out-Null
          Copy-Item $target app_binding_package/MASTER877_APP_BINDING_OBSERVATION.ps1
          '@echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0MASTER877_APP_BINDING_OBSERVATION.ps1"
          echo.
          pause' | Set-Content app_binding_package/RUN_ME.cmd -Encoding ASCII
          $inside=(Get-FileHash app_binding_package/MASTER877_APP_BINDING_OBSERVATION.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if($inside -ne $sha){throw 'APP_BINDING_PACKAGE_SHA_MISMATCH'}
          Write-Output "APP_BINDING_CONTAINED_PS1_SHA256=$inside"
      - name: Upload MASTER877 app binding observation
        uses: actions/upload-artifact@v4
        with:
          name: TMNM_MASTER877_APP_BINDING_OBSERVATION_VALIDATED
