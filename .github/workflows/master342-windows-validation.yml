          $keys='publish|approval|approve|8765|CANONICAL_BRIDGE|bridge|publisher|scheduler|requests\.|urllib|http://127\.0\.0\.1'
          $hits=@($fixture -split "\r?\n"|Where-Object{$_ -match $keys})
