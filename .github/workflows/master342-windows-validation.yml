          $fixture=@('SERVER_SIDE_PUBLISH_REFERENCE={',' "name":"control-room",',' "endpoint":"http://127.0.0.1:8765/api/publish"','}') -join [Environment]::NewLine
          if($fixture -notmatch 'SERVER_SIDE_PUBLISH_REFERENCE'){throw 'FIXTURE_REFERENCE_FAIL'}
