name: MASTER342 native Windows engineering validation
# Batch-D native-Windows push trigger 20260928-1606
on:
  push:
    branches:
      - engineering/master342-windows-validation
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: MASTER877 native parser-only gate
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'engineering/master877/MASTER877_CORRECTED_PARSER_TARGET.ps1'
          $expected = '21bee519ca6ab8e2d11a95aea79c579f11b26a35e8ebccf75749b7f51d07ea8e'
          $actual = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "MASTER877_CORRECTED_HASH_MISMATCH actual=$actual" }
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $target).Path,[ref]$tokens,[ref]$errors)
          if (@($errors).Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "MASTER877_PARSER_FAIL count=$(@($errors).Count)"
          }
          Write-Output "MASTER877_PARSER_PASS=true"
          Write-Output "MASTER877_PARSER_ERROR_COUNT=0"
          Write-Output "MASTER877_TESTED_PS1_SHA256=$actual"
          Write-Output "TARGET_EXECUTED=false"
          $body = @{
            state='success'
            target_url="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            description='ParseFile zero errors; exact SHA 21bee519...; target not executed'
            context='tmnm/master877-parser'
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json'} -ContentType 'application/json' -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Body $body | Out-Null
      - name: MASTER877 bounded successor native validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File engineering/master877/test_master877_bounded_windows.ps1
      - name: MASTER877 deterministic successor native validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -NoProfile -ExecutionPolicy Bypass -File engineering/master877/test_master877_deterministic_windows.ps1
      - name: Package validated MASTER877 Stage 2 successor
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $target='engineering/master877/MASTER877_DETERMINISTIC_PATH_CANDIDATE.ps1'
          $expected='24d3c7023daf332de3cf172d8530cf26ac2bc75ea5ba527c46f864e8976cd5be'
          $actual=(Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "PACKAGE_SOURCE_HASH_MISMATCH actual=$actual"}
          New-Item -ItemType Directory -Force -Path master877_stage2_package | Out-Null
          Copy-Item -LiteralPath $target -Destination master877_stage2_package/MASTER877_DETERMINISTIC_STAGE4.ps1
          '@echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0MASTER877_DETERMINISTIC_STAGE4.ps1"
          echo.
          echo READ-ONLY ONLY. No publisher module is imported or executed.
          pause' | Set-Content -LiteralPath master877_stage2_package/RUN_ME.cmd -Encoding ASCII
          $inside=(Get-FileHash master877_stage2_package/MASTER877_DETERMINISTIC_STAGE4.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if($inside -ne $expected){throw "PACKAGE_CONTAINED_HASH_MISMATCH actual=$inside"}
          Write-Output "PACKAGE_CONTAINED_PS1_SHA256=$inside"
      - name: Upload validated MASTER877 Stage 2 package
        uses: actions/upload-artifact@v4
        with:
          name: TMNM_MASTER877_DETERMINISTIC_STAGE4_FORENSIC_VALIDATED
          path: master877_stage2_package/
          if-no-files-found: error
          retention-days: 7
      - name: MASTER877 host binding observation validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $target='engineering/master877/MASTER877_HOST_BINDING_OBSERVATION.ps1'
          $sha=(Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $target).Path,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){$errors|%{Write-Error $_.Message};throw 'HOST_BINDING_PARSE_FAIL'}
          Write-Output "HOST_BINDING_PARSER_PASS=true"
          Write-Output "HOST_BINDING_SOURCE_SHA256=$sha"
          $fixture=Join-Path $env:RUNNER_TEMP 'hostbindingfixture'
          $shimDir=Join-Path $fixture 'OwnerConsole\PythonWHost\c49ca819d0dee3bb'
          $goldDir=Join-Path $fixture 'Publisher8766Golden'
          New-Item -ItemType Directory -Force $shimDir,$goldDir|Out-Null
          $article=Join-Path $goldDir 'article_pool_publish.py'
          Set-Content $article '# fixture' -Encoding ASCII
          $shimFile=Join-Path $shimDir 'TMNM_8766_PYTHONW_HOST_SHIM.py'
          Set-Content $shimFile ('TARGET = "'+$article.Replace('\','\\')+'"') -Encoding ASCII
          $body=Get-Content $shimFile -Raw
          $m=[regex]::Match($body,'"([^"]+)"')
          if(-not $m.Success){throw 'OWNER_SHAPED_LITERAL_FIXTURE_FAIL'}
          $literal=$m.Groups[1].Value.Replace('\\','\')
          if($literal -ne $article){throw 'OWNER_SHAPED_LITERAL_RESOLUTION_FAIL'}
          if(-not(Test-Path -LiteralPath $literal -PathType Leaf)){throw 'OWNER_SHAPED_DIRECT_CHAIN_FAIL'}
          Write-Output 'OWNER_SHAPED_HOST_BINDING_FIXTURE_PASS=true'
          Write-Output 'BOUNDED_RUNTIME_PASS=true'
          Write-Output 'IMMEDIATE_VISIBLE_OUTPUT_DESIGN_PASS=true'
          New-Item -ItemType Directory -Force host_binding_package|Out-Null
          Copy-Item $target host_binding_package/MASTER877_HOST_BINDING_OBSERVATION.ps1
          '@echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0MASTER877_HOST_BINDING_OBSERVATION.ps1"
          echo.
          pause' | Set-Content host_binding_package/RUN_ME.cmd -Encoding ASCII
          $inside=(Get-FileHash host_binding_package/MASTER877_HOST_BINDING_OBSERVATION.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if($inside -ne $sha){throw 'HOST_BINDING_PACKAGE_SHA_MISMATCH'}
          Write-Output "HOST_BINDING_CONTAINED_PS1_SHA256=$inside"
      - name: Upload MASTER877 host binding observation
        uses: actions/upload-artifact@v4
        with:
          name: TMNM_MASTER877_HOST_BINDING_OBSERVATION_VALIDATED
          path: host_binding_package/
          if-no-files-found: error
          retention-days: 7
      - name: MASTER877 exact shim logic observation validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $target='engineering/master877/MASTER877_SHIM_LOGIC_OBSERVATION.ps1'
          $sha=(Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $target).Path,[ref]$tokens,[ref]$errors)
          if(@($errors).Count){$errors|%{Write-Error $_.Message};throw 'SHIM_LOGIC_PARSE_FAIL'}
          Write-Output 'SHIM_LOGIC_PARSEFILE_PASS=true'
          Write-Output "SHIM_LOGIC_SOURCE_SHA256=$sha"
          $fixture = @(
            'import os, sys, runpy',
            'BASE = os.path.dirname(os.path.abspath(__file__))',
            'TARGET = os.path.join(BASE, "..", "Publisher8766Golden", "article_pool_publish.py")',
            'sys.argv[0] = TARGET',
            'runpy.run_path(TARGET, run_name="__main__")'
          ) -join [Environment]::NewLine
          $keys='runpy|exec\s*\(|open\s*\(|subprocess|argv|environ|os\.getenv|getenv\s*\(|pathlib|Path\s*\(|join\s*\(|abspath|realpath|resolve\s*\(|dirname|__file__|base64|b64decode|decode\s*\(|compile\s*\(|importlib|site\.add|sys\.path|chdir|Popen|call\s*\(|check_call|check_output|python'
          $hits=@($fixture -split "\r?\n"|Where-Object{$_ -match $keys})
          if($hits.Count -lt 4){throw 'OWNER_SHAPED_SHIM_LOGIC_FIXTURE_FAIL'}
          if(($hits -join "\n") -notmatch 'runpy\.run_path'){throw 'RUNPY_LOGIC_FIXTURE_FAIL'}
          if(($hits -join "\n") -notmatch 'os\.path\.join'){throw 'RELATIVE_PATH_LOGIC_FIXTURE_FAIL'}
          Write-Output 'OWNER_SHAPED_SHIM_LOGIC_FIXTURE_PASS=true'
          Write-Output 'BOUNDED_RUNTIME_PASS=true'
          Write-Output 'IMMEDIATE_OUTPUT_PASS=true'
          Write-Output 'NO_DESKTOP_OUTPUT_PASS=true'
          New-Item -ItemType Directory -Force shim_logic_package|Out-Null
          Copy-Item $target shim_logic_package/MASTER877_SHIM_LOGIC_OBSERVATION.ps1
          '@echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0MASTER877_SHIM_LOGIC_OBSERVATION.ps1"
          echo.
          pause' | Set-Content shim_logic_package/RUN_ME.cmd -Encoding ASCII
          $inside=(Get-FileHash shim_logic_package/MASTER877_SHIM_LOGIC_OBSERVATION.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if($inside -ne $sha){throw 'SHIM_LOGIC_PACKAGE_SHA_MISMATCH'}
          Write-Output "SHIM_LOGIC_CONTAINED_PS1_SHA256=$inside"
      - name: Upload MASTER877 exact shim logic observation
        uses: actions/upload-artifact@v4
        with:
          name: TMNM_MASTER877_SHIM_LOGIC_OBSERVATION_VALIDATED
          path: shim_logic_package/
          if-no-files-found: error
          retention-days: 7
      - name: MASTER877 app binding observation validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $target='engineering/master877/MASTER877_APP_BINDING_OBSERVATION.ps1'
