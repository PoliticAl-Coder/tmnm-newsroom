            if($body.IndexOf($required,[StringComparison]::Ordinal) -lt 0){throw "BATCHD_REQUIRED_CONTRACT_MISSING $required"}
          }
          if($body -match '(?i)\\Desktop\\|Environment\]::GetFolderPath\([^)]*Desktop|\$env:USERPROFILE\\Desktop'){throw 'BATCHD_DESKTOP_OUTPUT_CONTRACT_FAIL'}
          if($body -match '(?i)Invoke-RestMethod|Start-Process|Remove-Item|Move-Item|Rename-Item|Copy-Item'){throw 'BATCHD_READ_ONLY_CONTRACT_FAIL'}
