      - name: Batch D 8766 acquisition native Windows release gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $target='engineering/batchd/TMNM_8766_RENDERER_ACQUIRE.ps1'
          $expected='26b9f0914cddd0049cb7fe2e0f4f13814437d7dc55131252b0ad2e1871865055'
          $actual=(Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "BATCHD_EXACT_SHA_MISMATCH actual=$actual"}
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $target).Path,[ref]$tokens,[ref]$errors)
