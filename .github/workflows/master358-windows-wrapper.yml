name: MASTER358 native Windows wrapper
on:
  push:
    branches: [engineering/master342-windows-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wrapper:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute native CMD wrapper tests
        run: python -B engineering/source-recovery/test_master358_windows_wrapper.py
